#     authors: "Shoemaker, W.R., and J. Grilli"
#     venue: "mSystems, 11(3):e01221-25"
#     journal: https://doi.org/...       \
#     preprint: https://doi.org/...       |  any you have; leave out the rest.
#     data: https://doi.org/...           |  The title links to the journal
#     code: https://github.com/...       /   version, or else the preprint.
#
# Lab members' names are bolded automatically — the list of names to look for
# is `lab_members` in _config.yml. Type author lists as plain text.
#
# Optional:  note: "*equal contribution"   small grey text after the authors
#            hidden: true                  keep the entry but don't show it
#
# Always put title, authors and venue in "double quotes".
