# ---------------------------------------------------------------------------
# FLAGS — the countries the Team page knows how to show.
#
# In a person's file you write codes, e.g.  flags: [IT, UN]
# and the page shows the flags and tells screen readers the country names
# ("Italy and the United Nations"). To use a country not listed here, add a
# line: its two-letter code, the flag emoji, and its name. Copy flag emoji
# from https://emojipedia.org/flags
# ---------------------------------------------------------------------------

